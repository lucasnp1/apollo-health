<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
@font-face { font-family: NY; src: url(file:///System/Library/Fonts/NewYork.ttf); font-weight: 400 1000; }
@font-face { font-family: NY; font-style: italic; src: url(file:///System/Library/Fonts/NewYorkItalic.ttf); font-weight: 400 1000; }
html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
body { position: relative; -webkit-font-smoothing: antialiased; }
.cap { position: absolute; left: 96px; right: 96px; top: 150px; text-align: center; }
h1 { margin: 0; text-wrap: balance; }
.sub { margin: 34px auto 0; max-width: 1000px; text-wrap: balance; }
.chips { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 44px; }
.chip { padding: 16px 30px; border-radius: 999px; }
.eyebrow { margin-bottom: 30px; }
.phone { position: absolute; box-sizing: border-box; left: 50%; transform: translateX(-50%); width: 1080px; padding: 24px; border-radius: 176px; background: #0b0b0b; }
.screen { display: block; width: 100%; aspect-ratio: 1014 / 2203; border-radius: 152px; background-size: cover; background-position: top center; }
.pop { position: absolute; border-radius: 40px; background-repeat: no-repeat; }

/* Liber: warm paper family, Apple's New York serif, the keyword in italic */
body.liber { font-family: NY, serif; color: #1d1d1f; }
.liber h1 { font-weight: 640; font-size: 124px; line-height: 1.04; letter-spacing: -0.025em; }
.liber h1 em { font-style: italic; font-weight: 560; color: var(--accent); }
.liber .sub { font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 46px; line-height: 1.3; color: #4a4a4f; }
.liber .chip { font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 36px; font-weight: 600; background: rgba(255,255,255,.75); box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
.liber .phone { box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 70px 140px -40px rgba(60,40,20,.45), 0 24px 48px -24px rgba(60,40,20,.3); }
.liber .pop { box-shadow: 0 0 0 2px rgba(0,0,0,.06), 0 40px 90px -20px rgba(60,40,20,.45); }
body.liber.dark { color: #f7f4ee; }
.liber.dark .sub { color: #c9c4ba; }
.liber.dark .chip { background: rgba(255,255,255,.1); box-shadow: 0 0 0 2px rgba(255,255,255,.12); color: #f7f4ee; }
.liber.dark .phone { box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 80px 160px -40px rgba(0,0,0,.9); }

/* Magno: clinical instrument, cool near-black, one amber accent, mono eyebrow */
body.magno { font-family: 'Hanken Grotesk', sans-serif; color: #eef0f3; background: #0b0c0f radial-gradient(80% 40% at 50% 14%, rgba(251,182,54,.16), rgba(251,182,54,0) 70%); }
.magno .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 34px; letter-spacing: .28em; color: #fbb636; }
.magno h1 { font-weight: 650; font-size: 112px; line-height: 1.04; letter-spacing: -0.03em; }
.magno h1 em { font-style: normal; color: #fbb636; }
.magno .sub { font-size: 44px; line-height: 1.32; color: #a3a8b0; font-weight: 500; }
.magno .chip { font-family: 'JetBrains Mono', monospace; font-size: 30px; letter-spacing: .06em; color: #eef0f3; background: rgba(255,255,255,.06); box-shadow: 0 0 0 2px rgba(255,255,255,.1); }
.magno .phone { box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 80px 160px -40px rgba(0,0,0,.95); }
.magno .pop { box-shadow: 0 0 0 2px rgba(251,182,54,.55), 0 40px 100px -20px rgba(0,0,0,.95); }
</style></head><body>
<div class="cap"><div class="eyebrow" id="e"></div><h1 id="t"></h1><div class="sub" id="u"></div><div class="chips" id="c"></div></div>
<div class="phone" id="p"><div class="screen" id="s"></div></div>
<script>
// one shot, from #<json>: {app, dark, bg, accent, eyebrow, t ("*word*" = emphasis), sub, chips[], img, top, pops:[{x,y,w,h,at:[left,top],zoom}]}
const o = JSON.parse(decodeURIComponent(location.hash.slice(1)))
document.body.className = o.app + (o.dark ? ' dark' : '')
if (o.bg) document.body.style.background = o.bg
if (o.accent) document.body.style.setProperty('--accent', o.accent)
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
document.getElementById('t').innerHTML = esc(o.t).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>')
document.getElementById('e').textContent = o.eyebrow ?? ''
document.getElementById('u').textContent = o.sub ?? ''
document.getElementById('c').innerHTML = (o.chips ?? []).map((c) => `<span class="chip">${esc(c)}</span>`).join('')
const phone = document.getElementById('p')
phone.style.top = (o.top ?? 820) + 'px'
document.getElementById('s').style.backgroundImage = `url("${o.img}")`
// the screen is drawn 1032px wide from a 1014px capture; a pop-out lifts one region of it, zoomed, over the frame
const k = 1032 / 1014
for (const q of o.pops ?? []) {
  const z = q.zoom ?? 1.2, d = document.createElement('div')
  d.className = 'pop'
  // by default it lifts straight out of its own spot on the screen, centred on it
  const top = (o.top ?? 820) + 24
  const at = q.at ?? [144 + (q.x + q.w / 2) * k - (q.w * k * z) / 2, top + (q.y + q.h / 2) * k - (q.h * k * z) / 2]
  Object.assign(d.style, { left: at[0] + 'px', top: at[1] + 'px', width: q.w * k * z + 'px', height: q.h * k * z + 'px', backgroundImage: `url("${o.img}")`, backgroundSize: `${1014 * k * z}px auto`, backgroundPosition: `-${q.x * k * z}px -${q.y * k * z}px` })
  document.body.appendChild(d)
}
</script>
</body></html>
